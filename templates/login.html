{% extends "base.html" %}

{% block title %}Logga in – Veckopeng{% endblock %}

{% block content %}
  <form method="post" class="panel stack inloggning">
    <label>
      Lösenord
      <input type="password" name="losenord" required autofocus
             autocomplete="current-password">
    </label>
    {% if fel %}<p class="fel">{{ fel }}</p>{% endif %}
    <button type="submit">Logga in</button>
  </form>
{% endblock %}
